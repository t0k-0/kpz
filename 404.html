<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="3; url=./" />
    <title>Stránka nenalezena — KPZ</title>
    <style>
      :root { color-scheme: dark; --radius: 16px; font-family: system-ui, sans-serif; color: #f8f5ff; background: #0e0d13; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; }
      main { width: min(100%, 430px); background: #191721; border: 1px solid #332e40; border-radius: var(--radius); padding: 2rem; text-align: center; box-shadow: 0 18px 45px rgba(0,0,0,.3); }
      span { width: 52px; height: 52px; display: inline-grid; place-items: center; border-radius: var(--radius); background: #7558e8; color: white; font-size: 1.4rem; font-weight: 800; }
      h1 { margin: 1.2rem 0 .5rem; }
      p { color: #aaa2b8; line-height: 1.6; }
      a { display: inline-block; margin-top: .8rem; padding: .8rem 1.1rem; border-radius: var(--radius); background: #7558e8; color: white; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main><span>K</span><h1>Tahle stránka tu není.</h1><p>Vracíme tě zpátky do KPZ.</p><a href="./">Otevřít KPZ</a></main>
  </body>
</html>
